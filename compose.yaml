name: aishoppingagent

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      AISHOPPING_APP_NAME: ${AISHOPPING_APP_NAME:-AIShoppingAgent}
      AISHOPPING_DEBUG: ${AISHOPPING_DEBUG:-false}
      AISHOPPING_ENVIRONMENT: ${AISHOPPING_ENVIRONMENT:-development}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  database:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aishoppingagent}
      POSTGRES_USER: ${POSTGRES_USER:-aishoppingagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD in the root .env file}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
