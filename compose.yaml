name: aishoppingagent

x-bounded-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    logging: *bounded-logging
    image: aishoppingagent-app:local
    build:
      # TASK-091 (endurecimento de 2026-08-21): contexto na raiz do
      # repositório -- o Dockerfile precisa enxergar `backend/` e
      # `frontend/` para o estágio de build do frontend (Node só em
      # build-time). Os três serviços continuam a mesma imagem única.
      context: .
      dockerfile: Dockerfile
    environment:
      AISHOPPING_APP_NAME: ${AISHOPPING_APP_NAME:-AIShoppingAgent}
      AISHOPPING_DEBUG: ${AISHOPPING_DEBUG:-false}
      AISHOPPING_ENVIRONMENT: ${AISHOPPING_ENVIRONMENT:-development}
      AISHOPPING_LOG_LEVEL: ${AISHOPPING_LOG_LEVEL:-INFO}
      AISHOPPING_DATABASE_HOST: database
      AISHOPPING_DATABASE_PORT: 5432
      AISHOPPING_DATABASE_NAME: ${POSTGRES_DB:-aishoppingagent}
      AISHOPPING_DATABASE_USER: ${POSTGRES_USER:-aishoppingagent}
      AISHOPPING_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      AISHOPPING_GEMINI_API_KEY_USER_FILE: /run/secrets/gemini_api_key_user
      AISHOPPING_GEMINI_API_KEY_ADMIN_DEV_FILE: /run/secrets/gemini_api_key_admin_dev
      AISHOPPING_GROQ_API_KEY_FILE: /run/secrets/groq_api_key
      AISHOPPING_OPENROUTER_API_KEY_FILE: /run/secrets/openrouter_api_key
      AISHOPPING_FIRECRAWL_API_KEY_FILE: /run/secrets/firecrawl_api_key
      AISHOPPING_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      AISHOPPING_TELEGRAM_WEBHOOK_SECRET_FILE: /run/secrets/telegram_webhook_secret
      AISHOPPING_OPS_CONTROLLER_URL: http://ops_controller:8010
      AISHOPPING_OPS_CONTROLLER_SECRET_FILE: /run/secrets/ops_controller_secret
      AISHOPPING_OBSERVABILITY_ENABLED: "true"
      AISHOPPING_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      AISHOPPING_TRACE_SAMPLE_RATIO: ${AISHOPPING_TRACE_SAMPLE_RATIO:-1.0}
      AISHOPPING_READINESS_TIMEOUT_SECONDS: ${AISHOPPING_READINESS_TIMEOUT_SECONDS:-1.0}
      AISHOPPING_AUTH_PUBLIC_BASE_URL: ${AISHOPPING_AUTH_PUBLIC_BASE_URL:-http://localhost:8000}
      # TASK-091 (endurecimento de 2026-08-21): caminho do build da SPA
      # dentro da imagem (`Dockerfile`, estágio `frontend-build`). Só o
      # `api` serve HTTP (`register_spa`, via `app.main`) -- `telegram_notifier`/
      # `collection_worker` rodam outros comandos e nunca importam esse
      # módulo, por isso não recebem esta variável.
      AISHOPPING_SPA_DIST_DIR: /app/frontend-dist
      AISHOPPING_MAX_REQUEST_BODY_BYTES: ${AISHOPPING_MAX_REQUEST_BODY_BYTES:-65536}
      AISHOPPING_TELEGRAM_RATE_LIMIT_PER_MINUTE: ${AISHOPPING_TELEGRAM_RATE_LIMIT_PER_MINUTE:-20}
      AISHOPPING_EXTERNAL_HTTP_TIMEOUT_SECONDS: ${AISHOPPING_EXTERNAL_HTTP_TIMEOUT_SECONDS:-10}
      AISHOPPING_SAFE_RETRY_MAX_ATTEMPTS: ${AISHOPPING_SAFE_RETRY_MAX_ATTEMPTS:-3}
      AISHOPPING_RETRY_BASE_DELAY_SECONDS: ${AISHOPPING_RETRY_BASE_DELAY_SECONDS:-0.25}
      AISHOPPING_RETRY_MAX_DELAY_SECONDS: ${AISHOPPING_RETRY_MAX_DELAY_SECONDS:-5}
      AISHOPPING_RETRY_AFTER_CAP_SECONDS: ${AISHOPPING_RETRY_AFTER_CAP_SECONDS:-30}
      AISHOPPING_CIRCUIT_FAILURE_THRESHOLD: ${AISHOPPING_CIRCUIT_FAILURE_THRESHOLD:-5}
      AISHOPPING_CIRCUIT_OPEN_SECONDS: ${AISHOPPING_CIRCUIT_OPEN_SECONDS:-30}
      # DEC-046: 30 min é a implantação temporária com 8 GB de RAM; o alvo
      # da V1 é 15 min após o upgrade para 16 GB (docs/architecture/mission-schedules.md).
      # Mesma env var usada pelo collection_worker, para as duas fontes de
      # criação de agenda (Telegram/api e backfill/worker) nunca divergirem.
      AISHOPPING_COLLECTION_SCHEDULE_INTERVAL_MINUTES: ${AISHOPPING_COLLECTION_SCHEDULE_INTERVAL_MINUTES:-30}
      AISHOPPING_COLLECTION_SCHEDULE_STAGGER_SECONDS: ${AISHOPPING_COLLECTION_SCHEDULE_STAGGER_SECONDS:-300}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    secrets:
      - postgres_password
      - gemini_api_key_user
      - gemini_api_key_admin_dev
      - groq_api_key
      - openrouter_api_key
      - firecrawl_api_key
      - telegram_bot_token
      - telegram_webhook_secret
      - ops_controller_secret
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  telegram_notifier:
    logging: *bounded-logging
    image: aishoppingagent-app:local
    build:
      # TASK-091 (endurecimento de 2026-08-21): contexto na raiz do
      # repositório -- o Dockerfile precisa enxergar `backend/` e
      # `frontend/` para o estágio de build do frontend (Node só em
      # build-time). Os três serviços continuam a mesma imagem única.
      context: .
      dockerfile: Dockerfile
    environment:
      AISHOPPING_ENVIRONMENT: ${AISHOPPING_ENVIRONMENT:-development}
      AISHOPPING_LOG_LEVEL: ${AISHOPPING_LOG_LEVEL:-INFO}
      AISHOPPING_DATABASE_HOST: database
      AISHOPPING_DATABASE_PORT: 5432
      AISHOPPING_DATABASE_NAME: ${POSTGRES_DB:-aishoppingagent}
      AISHOPPING_DATABASE_USER: ${POSTGRES_USER:-aishoppingagent}
      AISHOPPING_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      AISHOPPING_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      # Correção (2026-08-17): faltava aqui -- sem esta variável, o worker
      # cai no default "http://localhost:8000" do código (`Settings.
      # auth_public_base_url`), que é inalcançável fora da própria máquina.
      # É o que monta o link curto de oferta ("Ver anúncio") enviado nos
      # alertas/pré-lista; `/cadastro`/`/entrar`/`/recuperar` funcionavam
      # porque rodam no serviço `api`, que já tinha a variável (linha acima
      # no bloco `api`). Mesma env var usada pelo `api`, para as duas fontes
      # de link nunca divergirem.
      AISHOPPING_AUTH_PUBLIC_BASE_URL: ${AISHOPPING_AUTH_PUBLIC_BASE_URL:-http://localhost:8000}
      AISHOPPING_OBSERVABILITY_ENABLED: "true"
      AISHOPPING_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      AISHOPPING_TRACE_SAMPLE_RATIO: ${AISHOPPING_TRACE_SAMPLE_RATIO:-1.0}
      AISHOPPING_EXTERNAL_HTTP_TIMEOUT_SECONDS: ${AISHOPPING_EXTERNAL_HTTP_TIMEOUT_SECONDS:-10}
      AISHOPPING_RETRY_AFTER_CAP_SECONDS: ${AISHOPPING_RETRY_AFTER_CAP_SECONDS:-30}
      AISHOPPING_CIRCUIT_FAILURE_THRESHOLD: ${AISHOPPING_CIRCUIT_FAILURE_THRESHOLD:-5}
      AISHOPPING_CIRCUIT_OPEN_SECONDS: ${AISHOPPING_CIRCUIT_OPEN_SECONDS:-30}
      AISHOPPING_EVENT_CONSUMER_MAX_ATTEMPTS: ${AISHOPPING_EVENT_CONSUMER_MAX_ATTEMPTS:-5}
      AISHOPPING_EVENT_RETRY_BASE_SECONDS: ${AISHOPPING_EVENT_RETRY_BASE_SECONDS:-60}
      AISHOPPING_EVENT_RETRY_CAP_SECONDS: ${AISHOPPING_EVENT_RETRY_CAP_SECONDS:-900}
      AISHOPPING_WORKER_FAILURE_BACKOFF_SECONDS: ${AISHOPPING_WORKER_FAILURE_BACKOFF_SECONDS:-5}
      AISHOPPING_WORKER_METRICS_PORT: 9464
    command: ["python", "-m", "app.telegram.worker"]
    expose:
      - "9464"
    secrets:
      - postgres_password
      - telegram_bot_token
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:9464/metrics', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  ops_controller:
    logging: *bounded-logging
    image: aishoppingagent-app:local
    command: ["uvicorn", "app.ops_controller:app", "--host", "0.0.0.0", "--port", "8010"]
    environment:
      DOCKER_HOST: http://docker-socket-proxy:2375
      OPS_CONTROLLER_SECRET_FILE: /run/secrets/ops_controller_secret
      # TASK-109 (fechamento): `collection_worker` não existe mais como
      # container -- status/start/restart passam pelo Windows Ops Agent
      # (ops_agent/collection_worker_ops_agent.py), HTTP loopback assinado
      # (HMAC+timestamp+nonce) na própria máquina Windows.
      WINDOWS_OPS_AGENT_URL: ${WINDOWS_OPS_AGENT_URL:-http://host.docker.internal:8021}
      WINDOWS_OPS_AGENT_SECRET_FILE: /run/secrets/windows_ops_agent_secret
    expose: ["8010"]
    secrets: [ops_controller_secret, windows_ops_agent_secret]
    networks: [default, docker_ops]
    depends_on: [docker-socket-proxy]
    restart: unless-stopped
    # `host.docker.internal` não é resolvido automaticamente pelo DNS
    # embutido dos containers neste ambiente: o servidor mantém `dns:
    # ["1.1.1.1", "8.8.8.8"]` fixo em `daemon.json` (Docker Desktop) desde o
    # incidente de interferência do Tailscale/MagicDNS em resoluções
    # externas (builds baixando de `files.pythonhosted.org` via IP CGNAT
    # errado). Esse override é herdado pelo resolvedor 127.0.0.11 de cada
    # container e passa a encaminhar também os nomes mágicos
    # `*.docker.internal` para os servidores externos, que devolvem
    # NXDOMAIN. Remover o override reabriria o incidente original, então a
    # correção fica escopada só aqui: `host-gateway` é o mecanismo nativo
    # do Docker Engine (independe do proxy DNS do Docker Desktop) e foi
    # validado empiricamente nesta máquina alcançando o Ops Agent real em
    # 127.0.0.1:8021 do host. Somente `ops_controller` fala com o Ops Agent
    # (único consumidor de `WINDOWS_OPS_AGENT_URL`), por isso o mapeamento
    # não é global.
    extra_hosts:
      - "host.docker.internal:host-gateway"

  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: 1
      POST: 1
      INFO: 0
      IMAGES: 0
      NETWORKS: 0
      SERVICES: 0
      SYSTEM: 0
      VOLUMES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [docker_ops]
    restart: unless-stopped

  # `collection_worker` saiu do Docker (TASK-109): roda nativo no Windows
  # (processo Python + Microsoft Edge real via CDP), fora deste
  # compose.yaml. Ver docs/architecture/windows-collection-worker.md para
  # a arquitetura completa e docs/tasks/TASK-109.md para o histórico da
  # migração. `ops_controller` continua expondo status/start/restart para
  # ele -- via o Windows Ops Agent (HTTP loopback assinado), não mais via
  # Docker.

  database:
    logging: *bounded-logging
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aishoppingagent}
      POSTGRES_USER: ${POSTGRES_USER:-aishoppingagent}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    secrets:
      - postgres_password
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  otel-collector:
    logging: *bounded-logging
    image: otel/opentelemetry-collector-contrib:0.157.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_started
    ports:
      - "127.0.0.1:${OTEL_HEALTH_PORT:-13133}:13133"
    restart: unless-stopped

  prometheus:
    logging: *bounded-logging
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  jaeger:
    logging: *bounded-logging
    image: jaegertracing/jaeger:2.20.0
    command:
      - --set=extensions.jaeger_storage.backends.some_storage.memory.max_traces=10000
    mem_limit: 512m
    ports:
      - "${JAEGER_BIND_ADDRESS:-127.0.0.1}:${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:16686/api/services"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  postgres_data:
  prometheus_data:

networks:
  docker_ops:
    internal: true

secrets:
  postgres_password:
    file: ${AISHOPPING_SECRETS_DIR:-./.secrets}/postgres_password
  gemini_api_key_user:
    file: ${AISHOPPING_SECRETS_DIR:-./.secrets}/gemini_api_key_user
  gemini_api_key_admin_dev:
    file: ${AISHOPPING_SECRETS_DIR:-./.secrets}/gemini_api_key_admin_dev
  groq_api_key:
    file: ${AISHOPPING_SECRETS_DIR:-./.secrets}/groq_api_key
  openrouter_api_key:
    file: ${AISHOPPING_SECRETS_DIR:-./.secrets}/openrouter_api_key
  firecrawl_api_key:
    file: ${AISHOPPING_SECRETS_DIR:-./.secrets}/firecrawl_api_key
  telegram_bot_token:
    file: ${AISHOPPING_SECRETS_DIR:-./.secrets}/telegram_bot_token
  telegram_webhook_secret:
    file: ${AISHOPPING_SECRETS_DIR:-./.secrets}/telegram_webhook_secret
  ops_controller_secret:
    file: ${AISHOPPING_SECRETS_DIR:-./.secrets}/ops_controller_secret
  windows_ops_agent_secret:
    # TASK-109: mesmo valor gerado/lido pelo Windows Ops Agent em
    # C:\ProgramData\AIShoppingAgent\secrets\ops-agent-secret (gerado
    # automaticamente no primeiro start do serviço, ver
    # ops_agent/collection_worker_ops_agent.py:_load_or_create_secret).
    # Precisa ser copiado manualmente para este arquivo -- os dois lados
    # não sincronizam sozinhos, e o valor nunca deve passar por chat/Git.
    file: ${AISHOPPING_SECRETS_DIR:-./.secrets}/windows_ops_agent_secret
