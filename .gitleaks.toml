title = "AIShoppingAgent working tree scan"

[extend]
useDefault = true

[allowlist]
description = "Local ignored secret stores and generated tooling are never commit candidates"
paths = [
  '''(^|[\\/])\.git([\\/]|$)''',
  '''(^|[\\/])\.tools([\\/]|$)''',
  '''(^|[\\/])\.secrets([\\/]|$)''',
  '''(^|[\\/])secrets([\\/]|$)''',
  '''(^|[\\/])\.env($|\.)''',
  '''(^|[\\/])\.venv([\\/]|$)''',
  '''(^|[\\/])__pycache__([\\/]|$)''',
  # Nunca rastreados pelo git (.gitignore local/global) -- scratch de
  # investigação (tmp/, .pytest-tmp/) e configuração local do próprio
  # Claude Code (.claude/), nunca candidatos a commit.
  '''(^|[\\/])tmp([\\/]|$)''',
  '''(^|[\\/])\.pytest-tmp([\\/]|$)''',
  '''(^|[\\/])\.claude([\\/]|$)''',
]
