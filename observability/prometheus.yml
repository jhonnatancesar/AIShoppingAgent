global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alert-rules.yml

scrape_configs:
  - job_name: aishopping-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8000]

  - job_name: aishopping-worker
    static_configs:
      - targets: [telegram_notifier:9464]

  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
